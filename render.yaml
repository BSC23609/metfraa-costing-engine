services:
  - type: web
    name: metfraa-costing-engine
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: TARGET_USER_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
